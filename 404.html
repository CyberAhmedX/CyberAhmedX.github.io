<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Ahmed Sajid Butt</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/favicon.ico?v=2" sizes="48x48">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="/assets/icon-192.png?v=2" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#ffffff;--card:#ffffff;--ink:#111418;--mute:#555b65;--line:#c9cdd3;--red:#c8102e;--ok:#1f7a45;color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1114;--card:#15181c;--ink:#eceef1;--mute:#9aa1ab;--line:#3a3f48;--red:#ff5c70;--ok:#5cc98a;color-scheme:dark}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 18px;background:var(--bg);color:var(--ink);font:17px/1.6 'IBM Plex Sans',system-ui,sans-serif}
  a{color:inherit;text-decoration:none}
  .panel{width:100%;max-width:560px;border:1px solid var(--line);background:var(--card)}
  .head{display:flex;justify-content:space-between;padding:10px 18px;border-bottom:1px solid var(--line);font:500 12px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
  .head .status{color:var(--red)}
  .body{padding:28px 24px 26px}
  .code{font:700 72px/1 'IBM Plex Sans',system-ui,sans-serif;letter-spacing:-.03em}
  .title{font-size:20px;font-weight:600;margin:10px 0 18px}
  .log{font:14px/1.7 'IBM Plex Mono',monospace;color:var(--mute);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:24px}
  .log strong{color:var(--ink);font-weight:500}
  .log .ok{color:var(--ok)}.log .crit{color:var(--red)}
  .actions{display:flex;gap:12px;flex-wrap:wrap}
  .btn{padding:11px 18px;border:1.5px solid var(--ink);font-weight:600;font-size:14px}
  .btn-primary{background:var(--ink);color:var(--bg)}.btn-primary:hover{background:var(--red);border-color:var(--red)}
  .btn-ghost:hover{background:var(--ink);color:var(--bg)}
  a:focus-visible{outline:2px solid var(--red);outline-offset:3px}
</style>
</head>
<body>
  <div class="panel">
    <div class="head">
      <span>ASB::SOC-PORTFOLIO</span>
      <span class="status">Alert</span>
    </div>
    <div class="body">
      <div class="code">404</div>
      <div class="title">Requested resource not found</div>
      <div class="log">
        <p><span class="crit">&gt;</span> GET <strong id="reqPath">/unknown</strong> - no match in route table</p>
        <p><span class="ok">&gt;</span> No indicators of compromise. Just a bad link.</p>
      </div>
      <div class="actions">
        <a class="btn btn-primary" href="/">Return to base ↩</a>
        <a class="btn btn-ghost" href="/#work">View case files →</a>
      </div>
    </div>
  </div>
  <script>
    var el = document.getElementById('reqPath');
    if (el) el.textContent = location.pathname || '/unknown';
  </script>
</body>
</html>
