name: Commit identity check

# Fails (and emails the repo owner) if any pushed commit carries an AI
# identity as author or committer, or any Co-authored-by trailer.
on: push

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check pushed commits
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            range="$AFTER"
          else
            range="$BEFORE..$AFTER"
          fi
          bad=$(git log --format='%h author=%an <%ae> committer=%cn <%ce>%n%(trailers:key=Co-authored-by)' $range \
            | grep -iE 'claude|anthropic|co-authored-by' || true)
          if [ -n "$bad" ]; then
            echo "::error::A pushed commit is not under Ahmed Sajid Butt's identity only."
            echo "$bad"
            exit 1
          fi
          echo "All pushed commits are under your identity only."
